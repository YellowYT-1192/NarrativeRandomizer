let lastNumber = null;

const timeFilter = document.getElementById("timeFilter");
const playerFilter = document.getElementById("playerFilter");
const tagFilter = document.getElementById("tagFilter");
const countEl = document.getElementById("count");

function selectedTags() {
  return Array.from(tagFilter.selectedOptions).map(o => o.value);
}

function filteredScenarios() {
  const t = timeFilter.value;
  const p = playerFilter.value;
  const tags = selectedTags();

  return scenarios.filter(s => {
    const timeOK = !t || s.time.replace(/\s+/g, "") === t;
    const playerOK = !p || s.players.replace(/\s+/g, "") === p;
    const tagOK = tags.length === 0 || tags.some(tag => s.tags.includes(tag));
    return timeOK && playerOK && tagOK;
  });
}

function updateCount() {
  const list = filteredScenarios();
  countEl.textContent = `現在の候補: ${list.length} / ${scenarios.length} 件`;
  document.getElementById("randomBtn").disabled = list.length === 0;
}

function randomize() {
  const list = filteredScenarios();
  if (!list.length) return;

  let candidates = list;
  if (list.length > 1 && lastNumber !== null) {
    const withoutLast = list.filter(s => s.number !== lastNumber);
    if (withoutLast.length) candidates = withoutLast;
  }
  const s = candidates[Math.floor(Math.random() * candidates.length)];
  lastNumber = s.number;

  document.getElementById("empty").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("title").textContent = s.title;
  document.getElementById("number").textContent = s.number;
  document.getElementById("author").textContent = s.author || "未記載";
  document.getElementById("players").textContent = s.players || "未記載";
  document.getElementById("time").textContent = s.time || "未記載";

  const tagsEl = document.getElementById("tags");
  tagsEl.innerHTML = "";
  if (s.tags.length) {
    s.tags.forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = tag;
      tagsEl.appendChild(span);
    });
  } else {
    tagsEl.textContent = "未記載";
  }

  document.getElementById("openBtn").onclick = () => window.open(s.url, "_blank", "noopener,noreferrer");
}

[timeFilter, playerFilter, tagFilter].forEach(el => el.addEventListener("change", updateCount));

document.getElementById("resetBtn").addEventListener("click", () => {
  timeFilter.value = "";
  playerFilter.value = "";
  Array.from(tagFilter.options).forEach(o => o.selected = false);
  updateCount();
});

document.getElementById("randomBtn").addEventListener("click", randomize);
updateCount();
</script>
